<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Poster design · Archita</title>
  <meta name="description" content="Posters made on the side, and the idea behind each one." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Caveat:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="logo logo--cat" aria-label="Home"><span class="cat" aria-hidden="true"><span class="cat-art"><img class="cat-base" src="assets/cat-base.png" alt="" width="439" height="485" /><img class="cat-tongue" src="assets/cat-tongue.png" alt="" width="90" height="54" /><i class="lid lid--l"></i><i class="lid lid--r"></i></span></span></a>
    <nav class="nav">
      <a href="index.html#hello" class="sticker sticker--c">About</a>
      <a href="index.html#work" class="sticker sticker--a">Work</a>
      <a href="index.html#contact" class="sticker sticker--d">Contact</a>
    </nav>
  </header>

  <main id="top" class="case">
    <section class="case-hero">
      <a href="index.html#work" class="mono back-link">← all work</a>
      <div class="case-title-row">
        <h1 class="case-title">Poster<br /><em>design</em></h1>
        <span class="stamp stamp--big mono">Design</span>
      </div>
      <p class="case-summary" data-reveal>Things I make when no one's asking. Tap a poster to see it big, and the idea behind it.</p>
    </section>

      <div class="posters posters--page" id="posters">
        <!-- data-concept: the idea behind each poster, shown under it in the lightbox (to be written with archita, one by one) -->
        <div class="pins">
          <figure class="pin" style="--r:-3deg">
            <i class="tape"></i>
            <button class="pin-open" data-full="assets/posters/only-limit.jpg" data-concept="The only limit is the one your mind came with. I've done so many things I never thought I could, because we're taught that your job title is the whole story. It isn't. I do product, I draw, I dance, all at once. The only thing that stops us is how we're wired, and once you get past that, everything opens up." aria-label="Open The only limit is your mind poster">
              <img src="assets/posters/only-limit.jpg" alt="The only limit is your mind poster" loading="lazy" />
            </button>
          </figure>
          <figure class="pin" style="--r:2.5deg">
            <i class="tape"></i>
            <button class="pin-open" data-full="assets/posters/swag.jpg" data-concept="Art is how I say the things words can't, and this one says happy. It's exactly what that day felt like: loud, red, a little extra. It isn't the whole me, but it's an honest preview, and I hope you can feel it too." aria-label="Open Swag poster">
              <img src="assets/posters/swag.jpg" alt="Swag poster" loading="lazy" />
            </button>
          </figure>
          <figure class="pin" style="--r:-1.5deg">
            <i class="tape"></i>
            <button class="pin-open" data-full="assets/posters/let-it-rip.jpg" data-concept="“Let it rip” is from The Bear, from a scene I still think about. Then I found this shark, mouth wide open, and the two just clicked. It's a nudge to stop overthinking and go for it. Everything is doable, so whatever you've been sitting on, let it rip." aria-label="Open Let it rip poster">
              <img src="assets/posters/let-it-rip.jpg" alt="Let it rip poster" loading="lazy" />
            </button>
          </figure>
          <figure class="pin" style="--r:3deg">
            <i class="tape"></i>
            <button class="pin-open" data-full="assets/posters/acceptance.jpg" data-concept="This one took me a month, and it's one of the pieces I'm proudest of. It started with a picture I saw online. I drew it by hand in pastels, then took it into Photoshop to finish it. A whole month, and the process never once got frustrating. The idea is right there in the words: accepting others should never mean erasing yourself." aria-label="Open Acceptance of others poster">
              <img src="assets/posters/acceptance.jpg" alt="Acceptance of others poster" loading="lazy" />
            </button>
          </figure>
          <figure class="pin" style="--r:-2deg">
            <i class="tape"></i>
            <button class="pin-open" data-full="assets/posters/embarrassment.jpg" data-concept="Michael Scott is never embarrassed. Not once, not even when he absolutely should be. He's my icon, my spirit animal, whatever you want to call it. This one's for him, and for anyone who could stand to be a little less scared of looking silly." aria-label="Open Embarrassment is an underexplored emotion poster">
              <img src="assets/posters/embarrassment.jpg" alt="Embarrassment is an underexplored emotion poster" loading="lazy" />
            </button>
          </figure>
        </div>
      </div>

    <!-- ============ NEXT ============ -->
    <section class="contact case-next" data-tear="top">
      <p class="hand contact-psst">next up ↓</p>
      <a class="contact-title next-link" href="index.html#contact">Say hi <em>→</em></a>
      <footer class="footer mono">
        <span>© 2026</span>
        <a href="index.html">back home ↑</a>
      </footer>
    </section>
  </main>

  <dialog class="lightbox" aria-label="Poster preview"><div class="lightbox-imgs"></div><p class="lightbox-concept"></p><span class="mono lightbox-close">click anywhere to close ✕</span></dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
