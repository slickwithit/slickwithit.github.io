<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Poster design · Archita</title>
  <meta name="description" content="Posters and edits made on the side, with the workflow behind them." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Caveat:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=19" />
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="logo logo--cat" aria-label="Home"><span class="cat" aria-hidden="true"><span class="cat-art"><img class="cat-base" src="assets/cat-base.png" alt="" width="439" height="485" /><img class="cat-tongue" src="assets/cat-tongue.png" alt="" width="90" height="54" /><i class="lid lid--l"></i><i class="lid lid--r"></i></span></span></a>
    <nav class="nav">
      <a href="index.html#hello" class="sticker sticker--c">About</a>
      <a href="index.html#work" class="sticker sticker--a">Work</a>
      <a href="index.html#contact" class="sticker sticker--d">Contact</a>
    </nav>
  </header>

  <main id="top" class="case">
    <section class="case-hero">
      <a href="index.html#work" class="mono back-link">← all work</a>
      <div class="case-title-row">
        <h1 class="case-title">Poster<br /><em>design</em></h1>
        <span class="stamp stamp--big mono">Design</span>
      </div>
      <p class="case-summary" data-reveal>Things I make when no one's asking. Tap one to see it big, and how it was made.</p>
    </section>

      <div class="posters posters--page" id="posters">
        <!-- data-video: the screen-recorded workflow, shown next to the design in the lightbox -->
        <div class="pins">
          <figure class="pin" style="--r:-3deg">
            <i class="tape"></i>
            <button class="pin-open" data-full="assets/posters/only-limit.jpg" aria-label="Open The only limit is your mind poster">
              <img src="assets/posters/only-limit.jpg" alt="The only limit is your mind poster" loading="lazy" />
            </button>
          </figure>
          <figure class="pin pin--video" style="--r:2.5deg">
            <i class="tape"></i>
            <button class="pin-open" data-full="assets/posters/archer.jpg|assets/posters/archer-pink.jpg|assets/posters/archer-purple.jpg" data-layout="carousel" data-ar="1" data-video="assets/workflow/archer.mp4" data-poster="assets/workflow/archer.jpg" aria-label="Open Gold dust archer">
              <img src="assets/posters/archer.jpg" alt="Gold dust archer" loading="lazy" /><svg class="pin-multi" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="14" height="14" rx="2"/><path d="M3 7v12a2 2 0 0 0 2 2h12"/></svg>
            </button>
            <span class="pin-tag mono">▶ workflow</span>
          </figure>
          <figure class="pin" style="--r:-1.5deg">
            <i class="tape"></i>
            <button class="pin-open" data-full="assets/posters/swag.jpg" aria-label="Open Swag poster">
              <img src="assets/posters/swag.jpg" alt="Swag poster" loading="lazy" />
            </button>
          </figure>
          <figure class="pin pin--video" style="--r:3deg">
            <i class="tape"></i>
            <button class="pin-open" data-full="assets/posters/let-it-rip.jpg" data-video="assets/workflow/let-it-rip.mp4" data-poster="assets/workflow/let-it-rip.jpg" aria-label="Open Let it rip poster">
              <img src="assets/posters/let-it-rip.jpg" alt="Let it rip poster" loading="lazy" />
            </button>
            <span class="pin-tag mono">▶ workflow</span>
          </figure>
          <figure class="pin pin--video" style="--r:-2deg">
            <i class="tape"></i>
            <button class="pin-open" data-full="assets/posters/ghost-light.jpg|assets/posters/ghost-light-blue.jpg|assets/posters/ghost-light-pink.jpg" data-layout="carousel" data-ar="1.495" data-video="assets/workflow/ghost-light.mp4" data-poster="assets/workflow/ghost-light.jpg" aria-label="Open Ghost light dancer">
              <img src="assets/posters/ghost-light.jpg" alt="Ghost light dancer" loading="lazy" /><svg class="pin-multi" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="14" height="14" rx="2"/><path d="M3 7v12a2 2 0 0 0 2 2h12"/></svg>
            </button>
            <span class="pin-tag mono">▶ workflow</span>
          </figure>
          <figure class="pin" style="--r:2deg">
            <i class="tape"></i>
            <button class="pin-open" data-full="assets/posters/acceptance.jpg" aria-label="Open Acceptance of others poster">
              <img src="assets/posters/acceptance.jpg" alt="Acceptance of others poster" loading="lazy" />
            </button>
          </figure>
          <figure class="pin pin--video" style="--r:-2.5deg">
            <i class="tape"></i>
            <button class="pin-open" data-full="assets/posters/embarrassment.jpg" data-video="assets/workflow/embarrassment.mp4" data-poster="assets/workflow/embarrassment.jpg" aria-label="Open Embarrassment is an underexplored emotion poster">
              <img src="assets/posters/embarrassment.jpg" alt="Embarrassment is an underexplored emotion poster" loading="lazy" />
            </button>
            <span class="pin-tag mono">▶ workflow</span>
          </figure>
        </div>
      </div>

    <!-- ============ NEXT ============ -->
    <section class="contact case-next" data-tear="top">
      <p class="hand contact-psst">next up ↓</p>
      <a class="contact-title next-link" href="branding.html">Next: brand identity <em>→</em></a>
      <footer class="footer mono">
        <span>© 2026</span>
        <a href="index.html">back home ↑</a>
      </footer>
    </section>
  </main>

  <dialog class="lightbox" aria-label="Poster preview"><div class="lightbox-imgs"></div><div class="lightbox-video"></div><p class="lightbox-concept"></p><span class="mono lightbox-close">click anywhere to close ✕</span></dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="js/main.js?v=14"></script>
</body>
</html>
